<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DataSong v2 — Semantic Explorer</title>
  <style>
    :root { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#171717; background:#f5f6f7; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:960px; margin:0 auto; padding:32px 20px 70px; }
    h1 { margin:0; font-size:32px; letter-spacing:-1px; }
    .subtitle { color:#666; margin:7px 0 24px; font-size:14px; }
    .panel { background:#fff; border:1px solid #e2e5e7; border-radius:16px; padding:18px; margin-bottom:16px; }
    form { display:flex; gap:9px; }
    input { flex:1; min-width:0; border:1px solid #d5d8db; border-radius:10px; padding:11px 13px; font-size:14px; }
    button { border:0; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; background:#161616; color:#fff; }
    button.secondary { background:#e9ebed; color:#333; }
    button:disabled { opacity:.42; cursor:default; }
    .meta { display:flex; flex-wrap:wrap; gap:15px; margin-top:14px; color:#666; font-size:13px; }
    .token { font-variant-numeric:tabular-nums; }
    .live { margin-top:12px; font-size:14px; line-height:1.45; }
    .artifact { margin-top:3px; color:#777; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; overflow-wrap:anywhere; }
    .loglink { color:#555; text-decoration:none; border-bottom:1px dotted #999; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:4px; }
    .section-title { font-size:17px; font-weight:800; }
    .summary { color:#777; font-size:12px; }
    .flow-list { border-top:1px solid #eceeef; margin-top:12px; }
    .flow { width:100%; text-align:left; color:inherit; background:transparent; border:0; border-radius:0; padding:14px 0 13px; border-bottom:1px solid #eceeef; display:block; }
    .flow:hover { background:#fafafa; }
    .flow-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; }
    .flow-title { font-size:15px; font-weight:750; }
    .flow-origin { color:#888; font-size:11px; margin-top:2px; font-weight:400; }
    .flow-pct { font-size:13px; font-weight:750; font-variant-numeric:tabular-nums; }
    .bar { height:6px; margin:8px 0 6px; background:#e9ecee; border-radius:999px; overflow:hidden; }
    .fill { height:100%; background:#34a853; transition:width .25s ease; }
    .flow.active .bar { height:8px; }
    .active-tag { display:inline-block; margin-left:8px; font-size:9px; letter-spacing:.06em; border-radius:999px; padding:3px 6px; color:#176d32; background:#e7f5eb; vertical-align:2px; }
    .flow-now { color:#555; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:400; }
    .flow.active .flow-now { color:#222; font-weight:600; }
    .seedline { display:flex; flex-wrap:wrap; gap:10px 18px; color:#666; font-size:12px; margin-top:9px; }
    .seedname { color:#247a3d; font-weight:700; }
    .empty { color:#888; font-size:13px; padding:16px 0 5px; }
    .mode { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; background:#f0f1f2; color:#666; border-radius:999px; padding:3px 7px; }
    dialog { width:min(900px,calc(100vw - 32px)); max-height:88vh; border:1px solid #dfe2e4; border-radius:16px; padding:0; box-shadow:0 18px 60px rgba(0,0,0,.22); }
    dialog::backdrop { background:rgba(0,0,0,.32); }
    .modal-head { display:flex; justify-content:space-between; gap:16px; align-items:start; padding:18px 20px 14px; border-bottom:1px solid #eceeef; position:sticky; top:0; background:#fff; z-index:2; }
    .modal-title { font-size:20px; font-weight:800; }
    .modal-sub { color:#777; font-size:12px; margin-top:4px; }
    .close { padding:8px 11px; background:#eceeef; color:#333; }
    .modal-body { padding:20px; overflow:auto; }
    .map-arc { padding:0 0 24px; margin-bottom:24px; border-bottom:1px solid #e7e9ea; }
    .map-arc:last-child { margin-bottom:0; border-bottom:0; }
    .map-title { font-weight:800; font-size:17px; margin-bottom:4px; }
    .map-intent { color:#555; font-size:13px; margin-bottom:16px; }
    .map-label { text-transform:uppercase; letter-spacing:.06em; font-size:10px; color:#999; font-weight:800; margin:14px 0 7px; }
    .stage-line { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .stage { border:1px solid #dfe3e5; border-radius:9px; padding:7px 9px; font-size:12px; background:#fafbfb; }
    .arrow { color:#aaa; font-size:13px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { border-radius:999px; padding:5px 8px; background:#f1f3f4; color:#444; font-size:11px; }
    .persist { background:#eaf6ee; color:#246d39; }
    .external { background:#fff3df; color:#815b12; }
    .relationship { padding:6px 0; font-size:12px; border-bottom:1px dotted #e6e6e6; }
    .evidence { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#777; padding:4px 0; overflow-wrap:anywhere; }
    .map-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:650px) { form { flex-wrap:wrap; } input { flex-basis:100%; } .map-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>DataSong v2</h1>
  <div class="subtitle">Call paths seed Pass 1; Pass 2 traces and proves the active business flow; Scout only looks for missing directions.</div>

  <div class="panel">
    <form id="form">
      <input id="repo" value="https://github.com/moqui/PopCommerce" aria-label="Repository URL" />
      <button id="go">Explore</button>
      <button id="stop" type="button" class="secondary" disabled>Stop</button>
      <button id="map" type="button" class="secondary" disabled>Display map</button>
    </form>
    <div class="meta">
      <span>Status: <b id="status">idle</b></span>
      <span>Step: <b id="step">0</b></span>
      <span class="token">Total tokens: <b id="tokens">0</b></span>
      <span class="token">Prompt: <b id="promptTokens">0</b></span>
      <span class="token">Completion: <b id="completionTokens">0</b></span>
      <span id="logWrap" style="display:none"><a class="loglink" href="/api/run-log">download run log</a></span>
    </div>
    <div class="live"><span id="mode" class="mode">idle</span> <span id="message"></span></div>
    <div id="artifact" class="artifact">—</div>
  </div>

  <div class="panel">
    <div class="section-head">
      <div class="section-title">Business flows</div>
      <div id="flowSummary" class="summary"></div>
    </div>
    <div id="seedSummary" class="seedline"></div>
    <div id="flows" class="flow-list"><div class="empty">No Pass-1 business flow yet.</div></div>
  </div>
</main>

<dialog id="mapDialog">
  <div class="modal-head">
    <div><div id="mapTitle" class="modal-title">Business map</div><div id="mapSubtitle" class="modal-sub"></div></div>
    <button id="closeMap" class="close" type="button">Close</button>
  </div>
  <div id="mapBody" class="modal-body"></div>
</dialog>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  let state = {};

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('go').disabled = true;
    const res = await fetch('/api/explore', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ repoUrl:$('repo').value.trim() }) });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      alert(body.error || 'Could not start exploration');
      $('go').disabled = false;
    }
  });

  $('stop').addEventListener('click', async () => {
    $('stop').disabled = true;
    await fetch('/api/stop', { method:'POST' });
  });
  $('map').addEventListener('click', () => showMap());
  $('closeMap').addEventListener('click', () => $('mapDialog').close());
  $('mapDialog').addEventListener('click', (e) => { if (e.target === $('mapDialog')) $('mapDialog').close(); });

  const events = new EventSource('/api/events');
  events.onmessage = (event) => render(JSON.parse(event.data));

  function currentMode(s) {
    if (s.stopRequested) return 'stopping';
    if ((s.callPathPreprocess?.status || '') !== 'complete') return 'call paths';
    if (String(s.lastMessage || '').startsWith('Scout')) return 'scout';
    if (s.pass1Scheduler?.activeArcId) return 'pass 2';
    if (s.status === 'exploring') return 'pass 1';
    return s.status || 'idle';
  }

  function render(next) {
    state = next || {};
    const running = ['preparing','exploring'].includes(state.status) && !state.stopRequested;
    $('status').textContent = state.status || 'idle';
    $('step').textContent = state.step || 0;
    $('tokens').textContent = state.tokenUsage?.total || 0;
    $('promptTokens').textContent = state.tokenUsage?.prompt || 0;
    $('completionTokens').textContent = state.tokenUsage?.completion || 0;
    $('mode').textContent = currentMode(state);
    $('message').textContent = state.lastMessage || '';
    $('artifact').textContent = state.currentArtifact?.path || '';
    $('go').disabled = running;
    $('stop').disabled = !running;
    $('map').disabled = !(state.pass1Arcs || []).length;
    $('logWrap').style.display = state.runLogFile ? '' : 'none';
    renderFlows();
  }

  function renderFlows() {
    const arcs = state.pass1Arcs || [];
    const activeId = state.pass1Scheduler?.activeArcId || '';
    const cp = state.callPathPreprocess || {};
    const seeded = cp.seededArcs || [];
    const seededByArc = new Map(seeded.map(x => [x.arcId, x]));
    const topo = cp.topologySummary || {};

    $('flowSummary').textContent = `${arcs.length} qualified · ${activeId ? '1 active' : 'none active'}`;
    $('seedSummary').innerHTML = [
      cp.status ? `Call paths: <b>${esc(cp.status)}</b>` : '',
      topo.topCandidateCount ? `${Number(topo.topCandidateCount)} top candidates` : '',
      topo.groupedVariantCount ? `${Number(topo.groupedVariantCount)} variants compressed` : '',
      seeded.length ? `<span class="seedname">${seeded.length} deterministic seeds → Pass 1</span>` : (cp.status === 'complete' ? '0 deterministic seeds' : ''),
      state.scout?.runs?.length ? `Scout checks: <b>${state.scout.runs.length}</b>` : ''
    ].filter(Boolean).map(x => `<span>${x}</span>`).join('');

    if (!arcs.length) {
      $('flows').innerHTML = `<div class="empty">${esc(state.lastMessage || 'Waiting for deterministic business-flow seeds.')}</div>`;
      return;
    }

    $('flows').innerHTML = arcs.map(arc => {
      const active = arc.id === activeId;
      const seed = seededByArc.get(arc.id);
      const origin = seed ? `deterministic seed · ${seed.callPathId || arc.callPathId || ''}` : (arc.seedSource === 'scout' ? 'Scout hypothesis admitted by Pass 1' : (arc.seedSource === 'call_path_preprocessor' ? `deterministic seed · ${arc.callPathId || ''}` : 'Pass-1 flow'));
      const pct = Math.max(0, Math.min(100, Number(arc.progress) || 0));
      let now = active ? (state.lastMessage || state.currentArtifact?.path || 'Exploring this flow…') : (arc.businessIntent || arc.outcome || arc.status || 'queued');
      return `<button type="button" class="flow ${active ? 'active' : ''}" data-arc-id="${esc(arc.id)}">
        <div class="flow-head">
          <div><div class="flow-title">${esc(arc.title || arc.id)}${active ? '<span class="active-tag">ACTIVE</span>' : ''}</div><div class="flow-origin">${esc(origin)}</div></div>
          <div class="flow-pct">${Math.round(pct)}%</div>
        </div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="flow-now">${esc(now)}</div>
      </button>`;
    }).join('');
    document.querySelectorAll('[data-arc-id]').forEach(el => el.addEventListener('click', () => showMap(el.dataset.arcId)));
  }

  function section(label, values, cls='') {
    const list = (values || []).filter(Boolean);
    if (!list.length) return '';
    return `<div class="map-label">${esc(label)}</div><div class="chips">${list.map(v => `<span class="chip ${cls}">${esc(v)}</span>`).join('')}</div>`;
  }

  function renderArcMap(arc) {
    const stages = arc.majorStages || [];
    const stageHtml = stages.length
      ? `<div class="map-label">Business steps</div><div class="stage-line">${stages.map((v,i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="stage">${esc(v)}</span>`).join('')}</div>`
      : '<div class="map-label">Business steps</div><div class="empty">Still being discovered.</div>';
    const evidence = (arc.evidence || []).slice(-12);
    return `<section class="map-arc">
      <div class="map-title">${esc(arc.title || arc.id)} · ${Math.round(Number(arc.progress)||0)}%</div>
      <div class="map-intent">${esc(arc.trigger || '')}${arc.businessIntent ? ` — ${esc(arc.businessIntent)}` : ''}${arc.outcome ? `<br><b>Outcome:</b> ${esc(arc.outcome)}` : ''}</div>
      ${stageHtml}
      <div class="map-grid">
        <div>${section('Entities', arc.entities)}${section('Persistent objects', arc.persistentObjects, 'persist')}</div>
        <div>${section('External effects', arc.externalEffects, 'external')}${section('Relationships', arc.relationships)}</div>
      </div>
      ${evidence.length ? `<div class="map-label">Evidence trail</div>${evidence.map(e => `<div class="evidence">${esc(e.artifactId || '')}${e.meaning ? ` — ${esc(e.meaning)}` : ''}</div>`).join('')}` : ''}
    </section>`;
  }

  function showMap(arcId='') {
    const arcs = state.pass1Arcs || [];
    const chosen = arcId ? arcs.filter(a => a.id === arcId) : arcs;
    if (!chosen.length) return;
    $('mapTitle').textContent = arcId ? (chosen[0].title || 'Business flow') : 'DataSong business map';
    $('mapSubtitle').textContent = arcId
      ? 'Current map for this Pass-1 arc. It updates as Pass 2 learns more.'
      : `${chosen.length} qualified business flow${chosen.length === 1 ? '' : 's'} · snapshot at ${state.tokenUsage?.total || 0} tokens`;
    $('mapBody').innerHTML = chosen.map(renderArcMap).join('');
    $('mapDialog').showModal();
  }

  fetch('/api/state').then(r => r.json()).then(render);
</script>
</body>
</html>
